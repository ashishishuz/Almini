{% extends 'alumni/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-80">
    <div class="col-md-4">
        <div class="login-card">
            <div class="card-body p-5">
                <h2 class="text-center gradient-text mb-4">Welcome Back!</h2>
                <form method="POST" class="login-form">
                    {% csrf_token %}
                    <div class="form-group mb-4">
                        <div class="input-group">
                            <input type="email" class="form-control custom-input" name="username" placeholder="📧 Enter your email" required>
                        </div>
                    </div>
                    <div class="form-group mb-4">
                        <div class="input-group">
                            <input type="password" class="form-control custom-input" name="password" id="password" placeholder="🔒 Enter your password" required>
                            <span class="input-group-text" id="togglePassword" style="cursor: pointer;">
                                <i class="fas fa-eye-slash"></i>
                            </span>
                        </div>
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger text-center py-2" id="errorAlert">
                            Invalid email or password
                        </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary btn-glow w-100 mb-4" id="loginBtn">
                        <span class="button-text">Login</span>
                        <div class="loading-progress">
                            <div class="loading-bar-round"></div>
                        </div>
                    </button>
                    <div class="text-center">
                       <a href="{% url 'alumni:admin_login' %}" class="text-primary"> <i class="fas fa-user-shield me-1"></i>Admin Login</a>
                    </p>
                        <p class="mt-3 mb-0">Don't have an account? <a href="{% url 'alumni:register' %}" class="register-link">Register here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .login-card {
        background: #ffffff;
        border-radius: 25px;
        border: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-width: 400px;
        margin: 0 auto;
    }

    .gradient-text {
        background: linear-gradient(45deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2rem;
        font-weight: 600;
    }

    .input-group {
        position: relative;
        background: #f8fafc;
        border-radius: 15px;
        overflow: hidden;
    }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
        z-index: 10;
    }

    .custom-input {
        height: 55px;
        padding-left: 50px;
        border: none;
        background: transparent;
        font-size: 1rem;
        width: 100%;
        transition: all 0.3s ease;
    }

    .custom-input:focus {
        outline: none;
        box-shadow: inset 0 0 0 2px #6366f1;
    }

    .btn-glow {
        background: linear-gradient(45deg, #6366f1, #8b5cf6);
        border: none;
        padding: 15px;
        font-weight: 600;
        font-size: 1rem;
        border-radius: 15px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .btn-glow:before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: 0.5s;
    }

    .btn-glow:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        background: linear-gradient(45deg, #8b5cf6, #6366f1);
    }

    .btn-glow:hover:before {
        left: 100%;
    }

    .btn-glow:active {
        transform: scale(0.98);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
    }

    /* Add ripple effect */
    .btn-glow .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transform: scale(0);
        animation: ripple 0.6s linear;
        pointer-events: none;
    }

    @keyframes ripple {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }

    .loading-progress {
        position: absolute;
        width: 100%;
        height: 3px;
        bottom: 0;
        left: 0;
        overflow: hidden;
        visibility: hidden;
    }

    .loading-bar-round {
        position: absolute;
        width: 30%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.7);
        border-radius: 3px;
        animation: loading-round 1.5s infinite ease-in-out;
    }

    @keyframes loading-round {
        0% {
            left: -30%;
        }
        50% {
            left: 40%;
        }
        100% {
            left: 100%;
        }
    }

    .loading-progress.active {
        visibility: visible;
    }

    .alert {
            transition: all 0.3s ease-in-out;
            opacity: 1;
        }

        .alert.fade-out {
            opacity: 0;
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }
</style>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.querySelector('input[name="password"]');

    togglePassword.addEventListener("click", function() {
        const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        
        // Toggle icon
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });

    // Add ripple effect
    document.querySelector('.btn-glow').addEventListener('click', function(e) {
        let ripple = document.createElement('span');
        ripple.classList.add('ripple');
        this.appendChild(ripple);
        let x = e.clientX - e.target.offsetLeft;
        let y = e.clientY - e.target.offsetTop;
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        setTimeout(() => {
            ripple.remove();
        }, 600);
    });

    document.querySelector('form').addEventListener('submit', function(e) {
        const btn = document.getElementById('loginBtn');
        const btnText = btn.querySelector('.button-text');
        const loadingProgress = btn.querySelector('.loading-progress');
        
        btnText.style.opacity = '0.7';
        loadingProgress.classList.add('active');
        
        setTimeout(() => {
            btnText.style.opacity = '1';
            loadingProgress.classList.remove('active');
        }, 4000);
    });

    // Auto-dismiss error message
    document.addEventListener('DOMContentLoaded', function() {
        const errorAlert = document.getElementById('errorAlert');
        if (errorAlert) {
            setTimeout(function() {
                errorAlert.classList.add('fade-out');
                setTimeout(() => {
                    errorAlert.remove();
                }, 300);
            }, 2000);
        }
    });
</script>
{% endblock %}
